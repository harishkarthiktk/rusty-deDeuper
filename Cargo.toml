[workspace]
resolver = "2"
members = [
    "crates/core",
    "crates/backend-generic",
    "crates/backend-windows",
    "crates/cli",
    "crates/tui",
    "bench",
    "xtask",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
rust-version = "1.89"
license = "MIT OR Apache-2.0"
repository = "https://example.invalid/dedupe"

[workspace.lints.clippy]
all = "deny"
perf = "deny"

[workspace.dependencies]
# runtime
rusqlite = { version = "0.32", features = ["bundled"] }
blake3 = "1.5"
thiserror = "2"
anyhow = "1"
smallvec = "1.13"
unicode-normalization = "0.1"
tracing = { version = "0.1", features = ["release_max_level_warn"] }
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
walkdir = "2.5"
globset = { version = "0.4", default-features = false }
clap = { version = "4.5", features = ["derive"] }
serde_json = "1"
indicatif = "0.17"
# backend FFI
rustix = { version = "0.38", features = ["fs", "system"] }
libc = "0.2"
windows-sys = "0.59"

# dev
proptest = "1.5"
tempfile = "3"
assert_cmd = "2"
predicates = "3"

# Default build: `cargo build --release`. Optimised but quick to compile.
# shortcut: no LTO and 16 codegen units cost some runtime speed; restore
# lto = "thin" and codegen-units = 1 before benchmarking or shipping.
[profile.release]
lto = false
codegen-units = 16
incremental = true
strip = "symbols"

# Debug build, only when needed: `cargo build` (dev profile), full debuginfo.
[profile.dev]
debug = true

[profile.dev.package."*"]
opt-level = 2
