# cargo-deny configuration. `cargo deny check` must pass (see B16).
#
# Advisory: deny known vulnerabilities, warn on unmaintained crates.
# Licenses: only the permissive set used by this dependency tree.
# Bans: warn on duplicate versions; no wildcard or git dependencies.

[advisories]
vulnerability = "deny"
unmaintained = "warn"
yanked = "warn"
ignore = []

[licenses]
unlicensed = "deny"
allow = [
    "MIT",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "ISC",
    "Unicode-3.0",
    "Unicode-DFS-2016",
    "Zlib",
    "MPL-2.0",
    "CC0-1.0",
    "Unlicense",
]

[bans]
multiple-versions = "warn"
wildcards = "deny"
deny = []

[graph]
targets = []
all-features = false
