[workspace]
resolver = "2"
members = [
    "crates/core",
    "crates/backend-generic",
    "crates/cli",
    "crates/tui",
    "bench",
    "xtask",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
rust-version = "1.80"
license = "MIT OR Apache-2.0"
repository = "https://example.invalid/dedupe"

[workspace.lints.clippy]
all = "deny"

[workspace.dependencies]
# runtime
rusqlite = { version = "0.32", features = ["bundled"] }
blake3 = "1.5"
thiserror = "2"
anyhow = "1"
smallvec = "1.13"
unicode-normalization = "0.1"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
walkdir = "2.5"
clap = { version = "4.5", features = ["derive"] }
serde_json = "1"
indicatif = "0.17"
# backend FFI
rustix = { version = "0.38", features = ["fs", "system"] }
libc = "0.2"

# dev
proptest = "1.5"
tempfile = "3"
assert_cmd = "2"
predicates = "3"

[profile.release]
lto = "thin"
codegen-units = 1
