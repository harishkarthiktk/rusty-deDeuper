[package]
name = "dedupe-backend-windows"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
description = "deDupe Windows backend: NTFS $MFT enumeration, open-by-id reads, overlapped read-ahead"

[lib]
name = "dedupe_backend_windows"
path = "src/lib.rs"

[dependencies]
dedupe-core = { path = "../core" }
dedupe-backend-generic = { path = "../backend-generic" }
# Pinned exactly: pre-1.0 crate with no documented whole-MFT iterator; upgrade on purpose.
ntfs = "=0.4.0"
tracing.workspace = true

[target.'cfg(windows)'.dependencies]
windows-sys = { workspace = true, features = [
    "Win32_Foundation",
    "Win32_Security",
    "Win32_Storage_FileSystem",
    "Win32_System_IO",
    "Win32_System_Ioctl",
    "Win32_System_Threading",
    "Win32_UI_Shell",
] }

[lints]
workspace = true
