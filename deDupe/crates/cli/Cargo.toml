[package]
name = "dedupe"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
description = "deDupe - duplicate file finder"

[[bin]]
name = "dedupe"
path = "src/main.rs"

[dependencies]
dedupe-core = { path = "../core" }
dedupe-backend-generic = { path = "../backend-generic" }
clap.workspace = true
anyhow.workspace = true
serde_json.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true
indicatif.workspace = true
ctrlc = "3"

# Only Windows builds link the NTFS fast path; other systems never compile it.
[target.'cfg(windows)'.dependencies]
dedupe-backend-windows = { path = "../backend-windows" }

[features]
default = []
test-hooks = ["dedupe-core/test-hooks"]

[dev-dependencies]
tempfile.workspace = true
assert_cmd.workspace = true
predicates.workspace = true

[lints]
workspace = true
